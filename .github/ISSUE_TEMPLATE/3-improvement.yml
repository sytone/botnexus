name: 'Improvement'
description: 'Something works, but should work better. Behaviour changes.'
labels: [type:improvement]
body:
  - type: markdown
    attributes:
      value: |
        **Improvement** — Something works, but should work better. Behaviour changes.
        Fields marked required are enforced. Agents: use `New-BotNexusIssue.ps1 -Action template -Type type:improvement` instead of this form.
  - type: textarea
    id: summary
    attributes:
      label: 'Summary'
      description: 'Two or three sentences: what is wrong or missing, and the outcome you want. Not a title restatement.'
    validations:
      required: true
  - type: textarea
    id: current_behaviour
    attributes:
      label: 'Current behaviour'
      description: 'What it does today, precisely. Measure it if you can.'
    validations:
      required: true
  - type: textarea
    id: desired_behaviour
    attributes:
      label: 'Desired behaviour'
      description: 'What it should do instead, and how you will know the difference.'
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: 'Impact'
      description: 'Who benefits and by how much. An improvement with no measurable benefit is a preference.'
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: 'Out of scope'
      description: 'Adjacent work this deliberately excludes.'
    validations:
      required: false
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: 'Acceptance criteria'
      description: 'Numbered, independently checkable clauses. Each one must be provable by a test, a command, or a file that exists. This is the close gate: the issue closes only when every clause is met.'
      placeholder: |
        1. First independently checkable clause
        2. Second clause
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: 'Files'
      description: 'Known-relevant paths, one per line. Saves an agent a discovery pass.'
    validations:
      required: false
  - type: textarea
    id: related
    attributes:
      label: 'Related'
      description: 'Issue/PR numbers and links. Parent epic goes here.'
    validations:
      required: false
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: 'Leave blank if unsure - triage will set it.'
      options: [priority:critical, priority:high, priority:medium, priority:low]
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options: [area:platform, area:channels, area:portal, area:mobile, area:security, area:tooling]
    validations:
      required: false
