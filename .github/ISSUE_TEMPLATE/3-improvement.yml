name: 'Improvement'
description: 'Something works, but should work better. Behaviour changes.'
labels: [type:improvement]
body:
  - type: markdown
    attributes:
      value: |
        **Improvement** — Something works, but should work better. Behaviour changes.
        Use a title such as [Portal] describe the problem or outcome. Required fields are enforced by this form; API clients must validate them too.
        Search existing issues before filing. Never include secrets or private infrastructure details. Report exploitable vulnerabilities through the private security link instead.
        Agents with the issue-creation skill: use `New-BotNexusIssue.ps1 -Action template -Type type:improvement` instead of this form.
  - type: textarea
    id: summary
    attributes:
      label: 'Summary'
      description: 'Explain the problem and wanted outcome in two or three short sentences. Use plain language; define technical terms. Do not repeat the title.'
    validations:
      required: true
  - type: textarea
    id: current_behaviour
    attributes:
      label: 'Current behaviour'
      description: 'What it does today, precisely. Measure it if you can.'
    validations:
      required: true
  - type: textarea
    id: desired_behaviour
    attributes:
      label: 'Desired behaviour'
      description: 'What it should do instead, and how you will know the difference.'
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: 'Impact'
      description: 'Who benefits and by how much. An improvement with no measurable benefit is a preference.'
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: 'Out of scope'
      description: 'Adjacent work this deliberately excludes.'
    validations:
      required: false
  - type: textarea
    id: example
    attributes:
      label: 'Example'
      description: 'Optional short user scenario: what someone tries, what happens now, and the wanted outcome. Use fictional names and synthetic data, not private systems or identifiers.'
    validations:
      required: false
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: 'Acceptance criteria'
      description: 'Numbered, independently checkable outcomes. Say what evidence proves each one: a named test, command result, reviewed document, or recorded decision. Separate required outcomes from suggestions. Close only when all required outcomes are verified.'
      placeholder: |
        1. First independently checkable clause
        2. Second clause
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: 'Validation plan'
      description: 'Name tests, commands, or review evidence that will prove the acceptance criteria. Include failure and boundary cases where relevant. Distinguish planned checks from results already observed; do not claim a test ran when it did not.'
    validations:
      required: false
  - type: textarea
    id: files
    attributes:
      label: 'Files'
      description: 'Known public repository paths and symbols, one per line. State what you checked against current source and what remains unverified. Do not include private machine paths.'
    validations:
      required: false
  - type: textarea
    id: related
    attributes:
      label: 'Related'
      description: 'Link related issues and PRs. Identify parent, children, duplicates, blocked-by issues, and required decisions or external prerequisites explicitly. A related link alone does not mean blocked.'
    validations:
      required: false
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: 'Optional. Leave blank if unsure. Explain high or critical priority using the impact evidence; do not infer urgency from the issue type.'
      options: [priority:critical, priority:high, priority:medium, priority:low]
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options: [area:platform, area:channels, area:portal, area:mobile, area:security, area:tooling, area:testing, area:trailguide]
    validations:
      required: false
