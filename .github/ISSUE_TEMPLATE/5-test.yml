name: 'Test coverage'
description: 'Missing or weak test coverage.'
labels: [type:test]
body:
  - type: markdown
    attributes:
      value: |
        **Test coverage** — Missing or weak test coverage.
        Use a title such as [Portal] describe the problem or outcome. Required fields are enforced by this form; API clients must validate them too.
        Search existing issues before filing. Never include secrets or private infrastructure details. Report exploitable vulnerabilities through the private security link instead.
        Agents with the issue-creation skill: use `New-BotNexusIssue.ps1 -Action template -Type type:test` instead of this form.
  - type: textarea
    id: summary
    attributes:
      label: 'Summary'
      description: 'Explain the problem and wanted outcome in two or three short sentences. Use plain language; define technical terms. Do not repeat the title.'
    validations:
      required: true
  - type: textarea
    id: coverage_gap
    attributes:
      label: 'Coverage gap'
      description: 'The exact behaviour that is unpinned, and how you know - a mutation that survives, a revert that stays green, a path with no assertion.'
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 'Environment'
      description: 'BotNexus version or commit, operating system, and relevant provider, channel, browser, SDK, or dependency version. Separate the affected installation from a test environment. Omit secrets and private infrastructure details.'
    validations:
      required: false
  - type: textarea
    id: regression_context
    attributes:
      label: 'Regression context'
      description: 'Did this work before? Give a last known good version or suspected change only when supported by evidence. Otherwise say unknown. Record frequency and whether a retry changes the result; a retry is not proof of a repair.'
    validations:
      required: false
  - type: textarea
    id: risk
    attributes:
      label: 'Risk'
      description: 'What could regress unnoticed today.'
    validations:
      required: true
  - type: textarea
    id: non_vacuity
    attributes:
      label: 'Non-vacuity'
      description: 'How the new test will be PROVEN to detect the wrong behaviour: name the mutation or revert that must turn it red. A test that cannot fail is decoration.'
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: 'Acceptance criteria'
      description: 'Numbered, independently checkable outcomes. Say what evidence proves each one: a named test, command result, reviewed document, or recorded decision. Separate required outcomes from suggestions. Close only when all required outcomes are verified.'
      placeholder: |
        1. First independently checkable clause
        2. Second clause
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: 'Validation plan'
      description: 'Name tests, commands, or review evidence that will prove the acceptance criteria. Include failure and boundary cases where relevant. Distinguish planned checks from results already observed; do not claim a test ran when it did not.'
    validations:
      required: false
  - type: textarea
    id: files
    attributes:
      label: 'Files'
      description: 'Known public repository paths and symbols, one per line. State what you checked against current source and what remains unverified. Do not include private machine paths.'
    validations:
      required: false
  - type: textarea
    id: related
    attributes:
      label: 'Related'
      description: 'Link related issues and PRs. Identify parent, children, duplicates, blocked-by issues, and required decisions or external prerequisites explicitly. A related link alone does not mean blocked.'
    validations:
      required: false
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: 'Optional. Leave blank if unsure. Explain high or critical priority using the impact evidence; do not infer urgency from the issue type.'
      options: [priority:critical, priority:high, priority:medium, priority:low]
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options: [area:platform, area:channels, area:portal, area:mobile, area:security, area:tooling, area:testing, area:trailguide]
    validations:
      required: false
  # <!-- BEGIN GENERATED CONTRIBUTOR USABILITY -->
  - type: textarea
    id: contributor_usability
    attributes:
      label: 'Contributor usability'
      description: 'Consumers: Name the consumers and supported platforms (Windows and Linux, or an explicit Windows-only/Linux-only scope). Setup: Describe public setup/configuration and prerequisites; link the user documentation and any single-platform limitation. Validation: Record clean temporary-home or hermetic-fixture validation, exact commands in backticks, and numeric results for each supported platform. Private prerequisites: State ''none''. No author-private skills, personal paths, or preseeded databases may be required; path redaction alone is not reuse. Docs-only: give a concrete reason runtime provisioning does not apply. Only documentation-file diffs qualify, regardless of PR title; do not claim an unperformed clean-install check.'
    validations:
      required: false
  # <!-- END GENERATED CONTRIBUTOR USABILITY -->
