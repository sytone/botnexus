name: 'Epic'
description: 'A parent issue that decomposes into sub-issues. Carries no implementation itself.'
labels: [type:epic]
body:
  - type: markdown
    attributes:
      value: |
        **Epic** — A parent issue that decomposes into sub-issues. Carries no implementation itself.
        Use a title such as [Portal] describe the problem or outcome. Required fields are enforced by this form; API clients must validate them too.
        Search existing issues before filing. Never include secrets or private infrastructure details. Report exploitable vulnerabilities through the private security link instead.
        Agents with the issue-creation skill: use `New-BotNexusIssue.ps1 -Action template -Type type:epic` instead of this form.
  - type: textarea
    id: summary
    attributes:
      label: 'Summary'
      description: 'Explain the problem and wanted outcome in two or three short sentences. Use plain language; define technical terms. Do not repeat the title.'
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 'Problem'
      description: 'The overall need this body of work serves.'
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: 'Goal'
      description: 'The end state. What is true when every child is closed.'
    validations:
      required: true
  - type: textarea
    id: decomposition
    attributes:
      label: 'Decomposition'
      description: 'List independently useful child outcomes and their issue links as `- [ ] #NNN outcome`. State dependencies and delivery order where needed; identify decisions that still need approval. Provisional child outcomes are allowed during planning, but file and link them before implementation starts. Do not duplicate child implementation checklists here.'
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: 'Out of scope'
      description: 'What this epic explicitly does not cover.'
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: 'Acceptance criteria'
      description: 'Numbered, independently checkable outcomes. Say what evidence proves each one: a named test, command result, reviewed document, or recorded decision. Separate required outcomes from suggestions. Close only when all required outcomes are verified.'
      placeholder: |
        1. First independently checkable clause
        2. Second clause
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: 'Files'
      description: 'Known public repository paths and symbols, one per line. State what you checked against current source and what remains unverified. Do not include private machine paths.'
    validations:
      required: false
  - type: textarea
    id: related
    attributes:
      label: 'Related'
      description: 'Link related issues and PRs. Identify parent, children, duplicates, blocked-by issues, and required decisions or external prerequisites explicitly. A related link alone does not mean blocked.'
    validations:
      required: false
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: 'Optional. Leave blank if unsure. Explain high or critical priority using the impact evidence; do not infer urgency from the issue type.'
      options: [priority:critical, priority:high, priority:medium, priority:low]
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options: [area:platform, area:channels, area:portal, area:mobile, area:security, area:tooling, area:testing, area:trailguide]
    validations:
      required: false
