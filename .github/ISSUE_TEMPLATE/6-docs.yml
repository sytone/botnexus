name: 'Documentation'
description: 'Documentation is missing, wrong, or misleading.'
labels: [type:docs]
body:
  - type: markdown
    attributes:
      value: |
        **Documentation** — Documentation is missing, wrong, or misleading.
        Fields marked required are enforced. Agents: use `New-BotNexusIssue.ps1 -Action template -Type type:docs` instead of this form.
  - type: textarea
    id: summary
    attributes:
      label: 'Summary'
      description: 'Two or three sentences: what is wrong or missing, and the outcome you want. Not a title restatement.'
    validations:
      required: true
  - type: textarea
    id: location
    attributes:
      label: 'Location'
      description: 'Which page or section. A path, not a topic.'
    validations:
      required: true
  - type: textarea
    id: what_is_wrong
    attributes:
      label: 'What is wrong'
      description: 'Missing, inaccurate, or contradicted by the code. Quote the offending line - a doc that confidently states a wrong count is worse than a missing page.'
    validations:
      required: true
  - type: textarea
    id: correct_content
    attributes:
      label: 'Correct content'
      description: 'The accurate version, if you know it.'
    validations:
      required: false
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: 'Acceptance criteria'
      description: 'Numbered, independently checkable clauses. Each one must be provable by a test, a command, or a file that exists. This is the close gate: the issue closes only when every clause is met.'
      placeholder: |
        1. First independently checkable clause
        2. Second clause
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: 'Files'
      description: 'Known-relevant paths, one per line. Saves an agent a discovery pass.'
    validations:
      required: false
  - type: textarea
    id: related
    attributes:
      label: 'Related'
      description: 'Issue/PR numbers and links. Parent epic goes here.'
    validations:
      required: false
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: 'Leave blank if unsure - triage will set it.'
      options: [priority:critical, priority:high, priority:medium, priority:low]
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options: [area:platform, area:channels, area:portal, area:mobile, area:security, area:tooling]
    validations:
      required: false
