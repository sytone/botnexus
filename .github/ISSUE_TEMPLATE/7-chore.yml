name: 'Chore'
description: 'Maintenance with no product behaviour change: dependencies, CI, build, tooling config.'
labels: [type:chore]
body:
  - type: markdown
    attributes:
      value: |
        **Chore** — Maintenance with no product behaviour change: dependencies, CI, build, tooling config.
        Fields marked required are enforced. Agents: use `New-BotNexusIssue.ps1 -Action template -Type type:chore` instead of this form.
  - type: textarea
    id: summary
    attributes:
      label: 'Summary'
      description: 'Two or three sentences: what is wrong or missing, and the outcome you want. Not a title restatement.'
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 'Problem'
      description: 'What is stale, broken or noisy in the toolchain.'
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: 'Impact'
      description: 'What it costs to leave it alone.'
    validations:
      required: false
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: 'Acceptance criteria'
      description: 'Numbered, independently checkable clauses. Each one must be provable by a test, a command, or a file that exists. This is the close gate: the issue closes only when every clause is met.'
      placeholder: |
        1. First independently checkable clause
        2. Second clause
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: 'Files'
      description: 'Known-relevant paths, one per line. Saves an agent a discovery pass.'
    validations:
      required: false
  - type: textarea
    id: related
    attributes:
      label: 'Related'
      description: 'Issue/PR numbers and links. Parent epic goes here.'
    validations:
      required: false
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: 'Leave blank if unsure - triage will set it.'
      options: [priority:critical, priority:high, priority:medium, priority:low]
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options: [area:platform, area:channels, area:portal, area:mobile, area:security, area:tooling, area:trailguide]
    validations:
      required: false
  # <!-- BEGIN GENERATED CONTRIBUTOR USABILITY -->
  - type: textarea
    id: contributor_usability
    attributes:
      label: 'Contributor usability'
      description: 'Consumers: Name the consumers and supported platforms (Windows and Linux, or an explicit Windows-only/Linux-only scope). Setup: Describe public setup/configuration and prerequisites; link the user documentation and any single-platform limitation. Validation: Record clean temporary-home or hermetic-fixture validation, exact commands in backticks, and numeric results for each supported platform. Private prerequisites: State ''none''. No author-private skills, personal paths, or preseeded databases may be required; path redaction alone is not reuse. Docs-only: give a concrete reason runtime provisioning does not apply. Only documentation-file diffs qualify, regardless of PR title; do not claim an unperformed clean-install check.'
    validations:
      required: false
  # <!-- END GENERATED CONTRIBUTOR USABILITY -->
