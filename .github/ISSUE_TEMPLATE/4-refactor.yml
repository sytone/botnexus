name: 'Refactor'
description: 'Restructuring that PRESERVES behaviour. If behaviour changes, it is an improvement or a fix.'
labels: [type:refactor]
body:
  - type: markdown
    attributes:
      value: |
        **Refactor** — Restructuring that PRESERVES behaviour. If behaviour changes, it is an improvement or a fix.
        Use a title such as [Portal] describe the problem or outcome. Required fields are enforced by this form; API clients must validate them too.
        Search existing issues before filing. Never include secrets or private infrastructure details. Report exploitable vulnerabilities through the private security link instead.
        Agents with the issue-creation skill: use `New-BotNexusIssue.ps1 -Action template -Type type:refactor` instead of this form.
  - type: textarea
    id: summary
    attributes:
      label: 'Summary'
      description: 'Explain the problem and wanted outcome in two or three short sentences. Use plain language; define technical terms. Do not repeat the title.'
    validations:
      required: true
  - type: textarea
    id: current_shape
    attributes:
      label: 'Current shape'
      description: 'The structure today and where it hurts: duplication, coupling, a seam in the wrong place. Quantify - ''five byte-identical copies'' beats ''lots of duplication''.'
    validations:
      required: true
  - type: textarea
    id: proposed_shape
    attributes:
      label: 'Proposed shape'
      description: 'The structure afterwards. Name the primitive or seam that becomes the single owner.'
    validations:
      required: true
  - type: textarea
    id: behaviour_parity
    attributes:
      label: 'Behaviour parity'
      description: 'Name the existing behavior that must stay unchanged, the suite that proves it, and any characterization tests needed first. Cover public contracts and failure behavior. If behavior intentionally changes, use Bug or Improvement instead.'
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: 'Out of scope'
      description: 'Call sites or modules deliberately left alone.'
    validations:
      required: false
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: 'Acceptance criteria'
      description: 'Numbered, independently checkable outcomes. Say what evidence proves each one: a named test, command result, reviewed document, or recorded decision. Separate required outcomes from suggestions. Close only when all required outcomes are verified.'
      placeholder: |
        1. First independently checkable clause
        2. Second clause
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: 'Validation plan'
      description: 'Name tests, commands, or review evidence that will prove the acceptance criteria. Include failure and boundary cases where relevant. Distinguish planned checks from results already observed; do not claim a test ran when it did not.'
    validations:
      required: false
  - type: textarea
    id: files
    attributes:
      label: 'Files'
      description: 'Known public repository paths and symbols, one per line. State what you checked against current source and what remains unverified. Do not include private machine paths.'
    validations:
      required: false
  - type: textarea
    id: related
    attributes:
      label: 'Related'
      description: 'Link related issues and PRs. Identify parent, children, duplicates, blocked-by issues, and required decisions or external prerequisites explicitly. A related link alone does not mean blocked.'
    validations:
      required: false
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: 'Optional. Leave blank if unsure. Explain high or critical priority using the impact evidence; do not infer urgency from the issue type.'
      options: [priority:critical, priority:high, priority:medium, priority:low]
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options: [area:platform, area:channels, area:portal, area:mobile, area:security, area:tooling, area:testing, area:trailguide]
    validations:
      required: false
