name: "CI: Build & Test"

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/workflows/deploy-docs.yml'
      - '.ai-team/**'
      - 'mkdocs.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'requirements.txt'
      - 'cliff.toml'
      - '.editorconfig'
      - '.gitattributes'
      - 'agents/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/workflows/deploy-docs.yml'
      - '.ai-team/**'
      - 'mkdocs.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'requirements.txt'
      - 'cliff.toml'
      - '.editorconfig'
      - '.gitattributes'
      - 'agents/**'

# Redundant CI: on a PR that pushes several commits in quick succession, cancel the
# superseded in-flight run so the latest commit wins instead of stacking builds.
#
# Push runs on main are NOT cancel-in-progress -- but that alone does not guarantee every
# merge gets gated (#3309). A concurrency group holds at most ONE pending run: when merges land
# faster than the suite completes, GitHub cancels the older PENDING run to make room for the
# newer one, so an entire burst of merges can collapse into a single executed run. On 2026-08-17,
# 15 merges landed in 13 minutes and 11 main push runs were cancelled that way -- which is how a
# commit that reddened main reached the PR queue unnoticed.
#
# Keying the group by SHA instead of by ref gives every merged commit its own group, so no main
# push run can ever supersede another. Bursty merges then queue rather than silently vanish, and
# main's true red/green state is recorded per commit. See issues #1548 and #3309.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # PRs: run the CORE suite -- everything except the browser/E2E projects.
  #
  # This deliberately replaced an impacted-only job. Impacted selection decides what to run from
  # a diff, so a change that breaks a project it does not textually touch passes CI and fails
  # later. It also produced no TRX, so its result counters read total=0 even on a green run --
  # the gate could not prove what it had executed.
  #
  # E2E is excluded on purpose and temporarily: on 2026-08-06 a full run reported exit 0 with
  # 265 of 280 E2E tests NotExecuted, which is neither passed nor failed, so a fixture crash
  # certified a green gate that had silently skipped them. Core must be trustworthy before E2E
  # is folded back in. The filter matches infra/buildtest/runner/entrypoint.ps1 'core' mode so
  # CI and the remote container gate agree on what core means.
  core-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore tools and packages
        run: |
          dotnet tool restore
          dotnet restore dirs.proj

      - name: Build
        run: dotnet build dirs.proj --no-restore

      - name: Test (core)
        run: dotnet test tests/dirs.proj --no-build --filter "FullyQualifiedName!~BotNexus.Integration.E2E&FullyQualifiedName!~BotNexus.E2E" --logger "trx;LogFilePrefix=ci" --results-directory ${{ github.workspace }}/artifacts/test-results

      # Judge the run by the same fail-closed contract the remote container gate uses (#3602).
      #
      # The step above answers only "did any test that ran fail?". It is silent on whether the
      # tests ran at all, so a crashed fixture, a filter typo or a missing TRX exits 0 and paints
      # this check green. On 2026-08-06 the E2E project emitted notExecuted=0 while carrying 265
      # NotExecuted rows -- 15 of 280 tests executed and the gate passed. The container grew
      # RunnerResult.ps1 for exactly that (#2851); CI never did, so a PR could be certified by a
      # standard this repo had already rejected.
      #
      # `if: always()` so a red dotnet test still gets its result contract evaluated and reported
      # rather than being short-circuited -- the contract's failureReason is the more informative
      # diagnostic of the two.
      - name: Validate test-result contract (core)
        if: always()
        shell: pwsh
        run: ./scripts/repo/Assert-TestResultContract.ps1 -ResultsDirectory '${{ github.workspace }}/artifacts/test-results' -MinimumTotal 12000 -SummaryPath '${{ github.workspace }}/artifacts/test-results/contract-core.json'

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-test-results
          path: artifacts/test-results/*.trx
          if-no-files-found: error

  # Push to main: full test suite with coverage (safety net)
  full-tests:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore dirs.proj

      - name: Build
        run: dotnet build dirs.proj --no-restore

      - name: Test
        # Core scope: everything except the browser/E2E projects. The filter is kept identical to
        # the core-tests job above and to infra/buildtest/runner/entrypoint.ps1 'core' mode --
        # three spellings of the same scope is how they drift apart.
        #
        # This previously also excluded BotNexus.Integration.* and BotNexus.Conversation.*, which
        # was over-broad: those projects declare their own environmental skips with stated reasons
        # ("Dev gateway not running at localhost:5006", "GITHUB_TOKEN not set"), so the runner can
        # execute them and report honest skips rather than never running them at all.
        run: dotnet test tests/dirs.proj --no-build --collect:"XPlat Code Coverage" --filter "FullyQualifiedName!~BotNexus.Integration.E2E&FullyQualifiedName!~BotNexus.E2E" --logger "trx;LogFilePrefix=ci" --results-directory ${{ github.workspace }}/artifacts/test-results

      # Same fail-closed contract as the PR job above (#3602). Main's push run is the safety net;
      # a safety net judged by a weaker standard than the PR gate it backstops is not one.
      #
      # This job previously emitted no TRX at all -- only coverage -- so there was literally
      # nothing to audit after the fact. The --logger/--results-directory added above is what
      # makes main's true red/green state reconstructable per commit.
      - name: Validate test-result contract (full)
        if: always()
        shell: pwsh
        run: ./scripts/repo/Assert-TestResultContract.ps1 -ResultsDirectory '${{ github.workspace }}/artifacts/test-results' -MinimumTotal 12000 -SummaryPath '${{ github.workspace }}/artifacts/test-results/contract-full.json'

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-test-results
          path: artifacts/test-results/*.trx
          if-no-files-found: error

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          fail_ci_if_error: false

  # Browser-emulated E2E is quarantined from automatic CI while #3601 is reviewed.
  # The projects and explicit `Invoke-AzureBuildTest.ps1 -Mode playwright|full` diagnostic paths
  # remain intact. Re-entry requires repeatable complete runs and a deliberate scope decision;
  # excluded browser coverage must never be represented as passing.
