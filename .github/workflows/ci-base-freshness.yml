name: "CI: Base Freshness & Main Health"

# Why this workflow exists (issue #3173)
# --------------------------------------
# `core-tests` in ci-build-test.yml answers "is this PR green against the base it was
# branched from?". It does NOT answer "is the tree that will exist on main after this
# merges green?". Those two questions diverge whenever a *tree-wide* rule and a
# violation of it merge concurrently on mutually stale bases.
#
# That is exactly how main went red on 2026-08-14: #3148 added the #3099 primitive-ID
# fence at 07:44:32 and #3164 added a file violating it at 07:48:20. Neither branch
# contained the other's commit, so both were correctly green, and the first tree that
# ever contained both was main itself.
#
# This workflow closes that hole from inside the repo:
#   * base-freshness  -- re-evaluates the tree-wide rules against HEAD merged with the
#                        CURRENT tip of main, not the PR's recorded base. A stale-base
#                        PR that would land a tree-wide violation fails here.
#   * main-health     -- reports the latest main run's conclusion so a red main is surfaced
#                        promptly instead of via an unrelated PR (AC3).
#
# Detection latency for main-health (measured, issue #3715)
# ---------------------------------------------------------
# The primary trigger is `workflow_run` on `CI: Build & Test` completing, so the probe
# fires at the moment main's verdict exists rather than waiting for a cron tick. Over the
# last 60 push-triggered runs on main, `CI: Build & Test` took a median of 13.1 min and a
# maximum of 15.4 min, so the WORST-CASE detection latency is that build duration plus the
# probe's own ~1 min: about 17 minutes from the breaking merge.
#
# The cron below is a BACKSTOP only, and it is deliberately hourly rather than */15.
# Measured over 213 h of run history, the previous `*/15` schedule delivered 68 runs
# against an expected 853 -- 8% of its declared rate, with a median gap of 149 min and a
# worst gap of 11.4 h. GitHub queues `schedule` events on a best-effort basis and drops
# them under load, and high-frequency crons on busy repositories are hit hardest. A `*/15`
# expression therefore advertised a 15-minute guarantee the platform never delivered.
# Hourly is honest about what cron can supply; the real guarantee comes from `workflow_run`.
#
# Both jobs write a GitHub step summary that states, in words, whether a failure was
# INHERITED from a red main or INTRODUCED by the PR (AC4).

on:
  pull_request:
    branches: [ main ]
  # Fires the moment main's build CONCLUDES, so a red main is surfaced in seconds
  # rather than whenever the scheduler next happens to run. Deliberately not `push`:
  # on a push the newest CI run for main is the one that push just queued, whose
  # conclusion is still null, and the probe below would read that as "not failure"
  # and report green on every single merge - a false green masking the real result
  # minutes later.
  workflow_run:
    workflows: ["CI: Build & Test"]
    branches: [ main ]
    types: [ completed ]
  schedule:
    # Backstop only -- catches a main left red by a run that never reported (cancelled
    # workflow, skipped push, platform incident). Not the primary detector; see the
    # detection-latency note in the header for why this is hourly and not '*/15'.
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read
  # main-health files and closes the "main is RED" issue. That issue IS the
  # notification: GitHub emails and push-notifies the assignee, which a red tick in the
  # Actions tab does not. main sat red for three days and twelve runs precisely because
  # the probe was only ever visible to someone who went looking.
  issues: write

jobs:
  # ---------------------------------------------------------------------------
  # AC1 (in-repo half): the merged tree, not the stale base, is what gets judged.
  # ---------------------------------------------------------------------------
  base-freshness:
    name: base freshness (tree-wide rules on merged tree)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Determine base staleness
        id: staleness
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          MAIN_SHA="$(git rev-parse origin/main)"
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          echo "main_sha=$MAIN_SHA" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor "$MAIN_SHA" "$HEAD_SHA"; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
            BEHIND=0
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
            BEHIND="$(git rev-list --count "$HEAD_SHA".."$MAIN_SHA")"
          fi
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"
          {
            echo "## Base freshness"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| PR head | \`$HEAD_SHA\` |"
            echo "| PR recorded base | \`$BASE_SHA\` |"
            echo "| current \`main\` | \`$MAIN_SHA\` |"
            echo "| commits behind \`main\` | $BEHIND |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Merge current main into head (test-only, never pushed)
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          if git merge --no-edit --no-ff origin/main; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            echo "> **Merge conflict with current \`main\`.** Rebase or merge \`main\` into this branch; the tree-wide rules could not be evaluated." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore tests/architecture/BotNexus.Architecture.Tests/BotNexus.Architecture.Tests.csproj

      # Only the architecture project runs here. It is the home of every rule whose
      # verdict depends on the WHOLE tree rather than on the diff -- the primitive-ID
      # fence (#3099), ConfigFieldCoverage, CoreTestScopeConsistency. Those are the
      # rules a stale base can defeat; per-file unit tests cannot be defeated this way
      # because the file and its test move together.
      - name: Tree-wide architecture rules against merged tree
        id: rules
        shell: bash
        run: |
          set -euo pipefail
          dotnet test tests/architecture/BotNexus.Architecture.Tests/BotNexus.Architecture.Tests.csproj \
            --logger "trx;LogFileName=merged.trx" \
            --results-directory "$GITHUB_WORKSPACE/artifacts/base-freshness"

      # AC4: name the failure class explicitly so nobody has to read two sets of logs
      # to work out whether they broke it or inherited it.
      - name: Classify failure (inherited vs introduced)
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          CONCLUSION="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow 'CI: Build & Test' \
            --branch main --limit 1 --json conclusion --jq '.[0].conclusion' || echo unknown)"
          {
            echo ""
            echo "## Verdict"
            echo ""
            if [ "$CONCLUSION" = "failure" ]; then
              echo "**INHERITED (probably).** The latest \`CI: Build & Test\` run on \`main\` concluded \`failure\`."
              echo "This branch merged with a \`main\` that is already red, so a red result here does not"
              echo "on its own mean this PR introduced anything. Compare the failing test names below with"
              echo "the failing tests on the linked \`main\` run before changing any code."
            else
              echo "**INTRODUCED.** The latest \`CI: Build & Test\` run on \`main\` concluded \`$CONCLUSION\`,"
              echo "so \`main\` is not known-red. A tree-wide architecture rule fails on the tree that would"
              echo "exist after this PR merges, even though the PR may be green against its own base."
              echo "Fix the violation -- do **not** widen a fence baseline; those baselines are shrink-only."
            fi
            echo ""
            echo "Latest \`main\` conclusion: \`$CONCLUSION\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload merged-tree results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: base-freshness-results
          path: artifacts/base-freshness/*.trx
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # AC3: a red main announces itself promptly. Driven by `workflow_run` on main's
  # own build completing (~17 min worst case), with an hourly cron as backstop.
  # ---------------------------------------------------------------------------
  main-health:
    name: main health probe
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe latest main run
        id: probe
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # --status completed is load-bearing: an in-flight run reports conclusion
          # null, which is not "failure", so without this filter the probe would call a
          # main whose tests are still running green.
          RUN_JSON="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow 'CI: Build & Test' \
            --branch main --status completed --limit 1 --json conclusion,databaseId,headSha,url \
            --jq '.[0] // empty')"
          if [ -z "$RUN_JSON" ]; then
            echo "No completed run found for main; nothing to report." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          CONCLUSION="$(echo "$RUN_JSON" | jq -r '.conclusion')"
          RUN_ID="$(echo "$RUN_JSON" | jq -r '.databaseId')"
          SHA="$(echo "$RUN_JSON" | jq -r '.headSha')"
          URL="$(echo "$RUN_JSON" | jq -r '.url')"
          {
            echo "## main health"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| conclusion | \`$CONCLUSION\` |"
            echo "| run id | [$RUN_ID]($URL) |"
            echo "| commit | \`$SHA\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo "conclusion=$CONCLUSION"
            echo "sha=$SHA"
            echo "run_id=$RUN_ID"
            echo "url=$URL"
          } >> "$GITHUB_OUTPUT"

          if [ "$CONCLUSION" = "failure" ]; then
            echo "::error::main is RED at $SHA (run $RUN_ID). Every PR branched from it inherits this failure."
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**\`main\` is RED.** Every open PR inherits it. Fix forward on \`main\`; do not disable tests." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "main is green at $SHA (run $RUN_ID)."
          fi

      # The issue is the delivery mechanism, not bookkeeping. One open issue is kept for
      # the whole outage - reopening a fresh one on every 15-minute tick would train the
      # reader to ignore it, which is the failure mode this is meant to cure.
      - name: Find the open main-is-red issue
        id: find
        if: steps.probe.outputs.conclusion == 'failure' || steps.probe.outputs.conclusion == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['ci'],
              state: 'open',
              per_page: 20,
            });
            const existing = issues.find(i => i.title.includes('main is RED'));
            return existing ? existing.number : null;

      - name: Open or update the main-is-red issue
        if: steps.probe.outputs.conclusion == 'failure'
        uses: actions/github-script@v7
        env:
          # Dynamic values arrive via process.env rather than ${{ }} interpolation into the
          # script body - the same rule the security workflow follows. A commit message or
          # run URL interpolated directly is both a script-injection vector and a way to
          # terminate a template literal with a stray backtick.
          RED_SHA: ${{ steps.probe.outputs.sha }}
          RED_URL: ${{ steps.probe.outputs.url }}
          RED_RUN_ID: ${{ steps.probe.outputs.run_id }}
          EXISTING: ${{ steps.find.outputs.result }}
        with:
          script: |
            const sha = process.env.RED_SHA || 'unknown';
            const url = process.env.RED_URL || '';
            const runId = process.env.RED_RUN_ID || '';
            const raw = process.env.EXISTING;
            const existing = raw && raw !== 'null' ? Number(raw) : null;

            const detail = [
              `**Commit:** \`${sha}\``,
              `**Failing run:** [${runId}](${url})`,
              '',
              'Every PR branched from `main` inherits this failure, so it will look like',
              'unrelated PRs are breaking. Fix forward on `main`; do not disable tests.',
            ].join('\n');

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing,
                body: `### Still red\n\n${detail}`,
              });
              core.info(`Updated existing issue #${existing}`);
            } else {
              const { data: issue } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '\u{1F6A8} main is RED - CI: Build & Test is failing',
                body: detail,
                labels: ['ci', 'bug'],
                assignees: [context.repo.owner],
              });
              core.info(`Opened issue #${issue.number}: ${issue.html_url}`);
            }

      - name: Close the issue once main is green
        if: steps.probe.outputs.conclusion == 'success' && steps.find.outputs.result != 'null'
        uses: actions/github-script@v7
        env:
          GREEN_SHA: ${{ steps.probe.outputs.sha }}
          GREEN_URL: ${{ steps.probe.outputs.url }}
          EXISTING: ${{ steps.find.outputs.result }}
        with:
          script: |
            const raw = process.env.EXISTING;
            const existing = raw && raw !== 'null' ? Number(raw) : null;
            if (!existing) return;
            const sha = process.env.GREEN_SHA || 'unknown';
            const url = process.env.GREEN_URL || '';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing,
              body: `main is green again at \`${sha}\` ([run](${url})). Closing.`,
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing,
              state: 'closed',
            });
            core.info(`Closed #${existing}`);

      # Last, so the steps above always run. The red check still matters for anyone who
      # IS looking at the Actions tab; the issue is for everyone who is not.
      - name: Fail the job when main is red
        if: steps.probe.outputs.conclusion == 'failure'
        run: exit 1
