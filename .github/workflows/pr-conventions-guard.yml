name: "PR Conventions Guard"
# Checks that a PR follows docs/development/pr-and-commit-conventions.md:
# Conventional-Commits title, issue link, required body sections, root cause on
# fixes, and screenshot/recording evidence for any change to rendered UI.
#
# ROLLOUT (#2317): warning-first. The guard annotates and writes a job summary
# but does not fail, so the in-flight PR queue can drain. Flip
# ENFORCEMENT_MODE in the script to "block" once the queue is clear.
#
# SAFETY: this runs on `pull_request_target` (so it can read PR context and
# comments), but it checks out ONLY the TRUSTED BASE copy of the guard script
# (`ref: github.event.pull_request.base.sha`, `persist-credentials: false`).
# It never executes any code from the PR head. The changed-file set is read from
# the API, not a working tree. The PR title and body are treated as inert text:
# regex-matched and echoed into a summary, never executed. A waiver is bound to
# the current head SHA, so a later push invalidates it.
# See .github/scripts/pr-conventions-guard.mjs.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: pr-conventions-guard-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true
jobs:
  guard:
    name: PR Conventions Guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # On comment events, only run for PR comments containing the waiver command.
    if: >
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '/allow-pr-convention-exception'))
    steps:
      - name: Resolve PR number
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const number = context.payload.pull_request?.number
              ?? context.payload.issue?.number;
            if (!number) {
              core.setFailed("Could not resolve a pull request number.");
              return;
            }
            core.setOutput("number", String(number));

      - name: Resolve trusted base SHA
        id: base
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number("${{ steps.pr.outputs.number }}"),
            });
            core.setOutput("sha", pr.base.sha);

      # Check out ONLY the trusted base copy of the repo. The guard script we
      # execute therefore comes from the base branch, never from the PR head.
      - name: Checkout trusted base
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.base.outputs.sha }}
          persist-credentials: false

      - name: Run guard
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = Number("${{ steps.pr.outputs.number }}");
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            // Normalize the payload so the script sees a pull_request in both
            // the pull_request_target and issue_comment event shapes.
            context.payload.pull_request = pr;
            const { run } = await import(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/pr-conventions-guard.mjs`
            );
            await run({ github, context, core });

      - name: Unit-test the guard script
        run: node --test .github/scripts/pr-conventions-guard.test.mjs
