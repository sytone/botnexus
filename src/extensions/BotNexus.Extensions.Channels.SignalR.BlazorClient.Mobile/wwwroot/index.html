<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <base href="/mobile/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>BotNexus</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="manifest" href="manifest.json" crossorigin="use-credentials" />
    <!-- Inter, shipped from the shared .Core project. Mobile previously had no webfont
         at all and fell back to system-ui, so the product rendered in a different
         typeface depending on which surface you opened. -->
    <link rel="preload" href="_content/BotNexus.Extensions.Channels.SignalR.BlazorClient.Core/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- The shared platform foundation MUST parse before mobile.css, which consumes its
         tokens. This is the single source of colour and type for the whole product. -->
    <link rel="stylesheet" href="_content/BotNexus.Extensions.Channels.SignalR.BlazorClient.Core/css/tokens.css" />
    <link rel="stylesheet" href="css/mobile.css" />
    <script>
        // Applied BEFORE first paint. The portal is served from the same origin, so this
        // reads the SAME localStorage blob PortalPreferencesService writes there: a user who
        // chose light in the portal gets light here without setting it twice. Dark stays the
        // default and lives on :root, so it is the absence of the attribute.
        // Mobile ships no theme toggle of its own yet - this only honours the preference.
        (function () {
            try {
                var raw = localStorage.getItem('botnexus.portal.prefs');
                if (raw && JSON.parse(raw).Theme === 'light') {
                    document.documentElement.setAttribute('data-theme', 'light');
                }
            } catch (e) {
                // Unparseable or unavailable storage - dark is the default, so do nothing.
            }
        })();
    </script>
</head>
<body>
    <div id="app">
        <div style="display:flex;align-items:center;justify-content:center;height:100dvh;background:#0a1628;color:#d0dff0;">
            Loading…
        </div>
    </div>
    <div id="blazor-error-ui">An error has occurred. <a href="" class="reload">Reload</a> <button type="button" aria-label="Dismiss error" onclick="document.getElementById('blazor-error-ui').style.display='none'">&#x2715;</button></div>
    <script src="js/errorReporting.js"></script>
    <script src="js/marked.min.js"></script>
    <script src="js/purify.min.js"></script>
    <script src="js/markdown.js"></script>
    <script src="js/chatScroll.js"></script>
    <script src="js/canvasBridge.js"></script>
    <script src="js/appResume.js"></script>
    <script src="js/swUpdate.js"></script>
    <script src="js/bootDiagnostics.js"></script>
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script>
        // #2880: the mobile client has the same static loading div and the same default-autostart
        // script tag as the desktop portal, so it is NOT exempt -- a failed boot behind the auth
        // proxy would otherwise leave "Loading..." on screen indefinitely with no explanation.
        window.BotNexusBoot.startBlazor();
    </script>
    <script>
        // #2591: registration alone let a cached worker pin a stale bundle forever. BotNexusSwUpdate
        // registers with updateViaCache:'none', re-checks on foreground return, and reloads when a
        // new worker takes control. The published build swaps service-worker.js ->
        // service-worker.published.js via the csproj <ServiceWorker> item, so this URL is correct
        // for both dev and published.
        window.BotNexusSwUpdate.register('service-worker.js');
    </script>
</body>
</html>
