<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials" />
    <!-- Dark is the portal default; the boot script below re-reads this from --color-surface
         once the stylesheet has parsed, so the browser chrome always matches the top bar. -->
    <meta name="theme-color" content="#151a21" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BotNexus" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <title>BotNexus</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <!-- Preload the latin subset: it is needed for the very first paint, and discovering it
         only after the foundation parses would guarantee a visible swap. latin-ext is
         deliberately NOT preloaded - it is fetched on demand via unicode-range. Inter now
         ships from the shared .Core project so the mobile client gets the same typeface. -->
    <link rel="preload" href="_content/BotNexus.Extensions.Channels.SignalR.BlazorClient.Core/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- The shared platform foundation MUST parse before app.css: app.css consumes its tokens,
         and the pre-first-paint script below reads --color-surface back off it. -->
    <link rel="stylesheet" href="_content/BotNexus.Extensions.Channels.SignalR.BlazorClient.Core/css/tokens.css?v=ds14" />
    <link rel="stylesheet" href="css/app.css?v=ds14" />
    <script>
        // Applied BEFORE first paint and before Blazor boots. The WASM runtime takes seconds to
        // start; without this a light-theme user would stare at a fully dark portal until it did,
        // then watch it flip. Reads the same localStorage blob PortalPreferencesService writes.
        (function () {
            try {
                var raw = localStorage.getItem('botnexus.portal.prefs');
                if (raw && JSON.parse(raw).Theme === 'light') {
                    document.documentElement.setAttribute('data-theme', 'light');
                }
            } catch (e) {
                // Unparseable or unavailable storage - dark is the default, so do nothing.
            }

            // The browser chrome should match the app's top bar, which is --color-surface.
            // Read it from the stylesheet rather than repeating the hex here, so the meta
            // tag and the theme can never drift apart.
            try {
                var meta = document.querySelector('meta[name="theme-color"]');
                var surface = getComputedStyle(document.documentElement)
                    .getPropertyValue('--color-surface').trim();
                if (meta && surface) { meta.setAttribute('content', surface); }
            } catch (e) {
                // No computed style yet - the static meta value stands.
            }
        })();
    </script>
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="loading-screen">
            <div class="loading-spinner"></div>
            <p>Loading BotNexus...</p>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">X</span>
    </div>
    <script src="js/errorReporting.js"></script>
    <script src="js/marked.min.js"></script>
    <script src="js/purify.min.js"></script>
    <script src="js/markdown.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/splitter.js"></script>
    <script src="js/canvasBridge.js"></script>
    <script src="js/toolFrame.js"></script>
    <script>
        // Clipboard helper for copy-to-clipboard via JS interop
        window.BotNexus = window.BotNexus || {};
        window.BotNexus.copyToClipboard = function (text) {
            if (navigator.clipboard) {
                return navigator.clipboard.writeText(text).then(function () { return true; }, function () { return false; });
            }
            return Promise.resolve(false);
        };
    </script>
    <script src="js/bootDiagnostics.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js" autostart="false"></script>
    <script>
        // #2880: default autostart leaves a failed boot as an unhandled rejection, so the static
        // .loading-screen above is never torn down and the user sees the spinner forever. Starting
        // explicitly through BotNexusBoot attaches a rejection handler that replaces #app with an
        // actionable panel, and distinguishes an auth-proxy login interstitial from a real fault.
        window.BotNexusBoot.startBlazor();
    </script>
    <script src="js/swUpdate.js"></script>
    <script>
        // Register the PWA service worker so Edge/Chromium treats the portal as installable.
        // #2591: registration alone let a cached worker pin a stale bundle forever, so this goes
        // through BotNexusSwUpdate -- updateViaCache:'none', a foreground update check, and a
        // reload on controllerchange. The published build swaps service-worker.js ->
        // service-worker.published.js via the csproj <ServiceWorker> item, so this URL is correct
        // for both dev and published.
        window.BotNexusSwUpdate.register('service-worker.js');
    </script>
</body>

</html>
